<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Longhaul: Stay in context. Go the distance.</title>
  <desc id="desc">A Claude Code plugin. A sketch of one long session's context: it grows with each request, the guard flags a big whole read, a compaction empties it, and the checkpoint comes back.</desc>
  <!-- For GitHub's dark themes: no background of its own, so the page's shows through. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Identity -->
  <text x="72" y="108" class="mono" font-size="14" letter-spacing="3" fill="#9198A1">A CLAUDE CODE PLUGIN</text>
  <text x="68" y="184" class="sans" font-size="80" font-weight="800" letter-spacing="4" fill="#F0F6FC">LONGHAUL</text>
  <text x="72" y="232" class="sans" font-size="30" font-weight="600" fill="#F5B544">Stay in context. Go the distance.</text>
  <text class="sans" font-size="18" fill="#9198A1">
    <tspan x="72" y="280">See where the tokens go.</tspan>
    <tspan x="72" y="306">Catch the reads that flood the context.</tspan>
    <tspan x="72" y="332">Pick up where you left off after a compaction.</tspan>
  </text>

  <!-- One long session's context: a sketch, not a measurement -->
  <rect x="650" y="64" width="566" height="286" rx="14" fill="#151B23" stroke="#3D444D"/>
  <text x="674" y="96" class="mono" font-size="14" letter-spacing="2" fill="#9198A1">CONTEXT, ONE LONG SESSION</text>
  <line x1="674" y1="118" x2="1192" y2="118" stroke="#656C76" stroke-dasharray="4 6"/>
  <text x="680" y="138" class="mono" font-size="13" fill="#9198A1">context window</text>
  <line x1="674" y1="300" x2="1192" y2="300" stroke="#3D444D"/>

  <path d="M674 300V286H700V280H726V272H752V266H778V258H800V196H830V190H860V180H890V170H920V160H950V148H975V136H1000V128H1010V268H1022V262H1050V256H1080V248H1110V240H1140V232H1170V222H1192V300Z" fill="url(#fill)"/>
  <path d="M674 286H700V280H726V272H752V266H778V258H800V196H830V190H860V180H890V170H920V160H950V148H975V136H1000V128H1010V268H1022V262H1050V256H1080V248H1110V240H1140V232H1170V222H1192" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- The guard flags a big whole read -->
  <line x1="800" y1="196" x2="800" y2="306" stroke="#F5B544" stroke-opacity="0.5" stroke-dasharray="3 4"/>
  <circle cx="800" cy="196" r="6" fill="#F5B544"/>
  <text x="790" y="180" text-anchor="end" class="mono" font-size="16" font-weight="700" fill="#F5B544">guard</text>
  <text x="800" y="326" text-anchor="middle" class="mono" font-size="14" fill="#9198A1">big whole read flagged</text>

  <!-- Compaction, and the checkpoint coming back -->
  <line x1="1010" y1="112" x2="1010" y2="306" stroke="#9198A1" stroke-opacity="0.6" stroke-dasharray="3 4"/>
  <path d="M1022 262V236" stroke="#F0F6FC" stroke-width="2"/>
  <path d="M1022 236H1038L1034 242L1038 248H1022Z" fill="#2DD4BF"/>
  <text x="1018" y="152" class="mono" font-size="14" fill="#9198A1">compaction</text>
  <text x="1022" y="326" text-anchor="middle" class="mono" font-size="14" fill="#9198A1">checkpoint back</text>

  <!-- inspect reads all of it -->
  <text x="1192" y="96" text-anchor="end" class="mono" font-size="14" fill="#9198A1">inspect: where it all went</text>

  <!-- The road -->
  <line x1="72" y1="378" x2="1208" y2="378" stroke="#F5B544" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="28 18" stroke-linecap="round"/>
</svg>
